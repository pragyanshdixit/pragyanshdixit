name: Generate LeetCode Heatmap

on:
  schedule:
    - cron: "0 0 * * *"      # runs every day at midnight UTC
  workflow_dispatch:         # allows manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main            # or your default branch

      - name: Generate LeetCode heatmap
        uses: JacobLinCool/leetcode-heatmap-action@v1
        with:
          username: pragyanshdixit
          output: leetcode-heatmap.svg
          theme: dark           # use 'light' for light theme
          border: 0

      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add leetcode-heatmap.svg
          git diff --staged --quiet || git commit -m "Update LeetCode heatmap"
          git push
