name: Generate LeetCode Heatmap

on:
  schedule:
    - cron: "0 0 * * *"      # daily at midnight UTC
  workflow_dispatch:         # manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate LeetCode heatmap
        run: npx leetcode-heatmap@latest --user pragyanshdixit --output leetcode-heatmap.svg --theme dark --border 0

      - name: Commit and push if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add leetcode-heatmap.svg
          git diff --staged --quiet || git commit -m "Update LeetCode heatmap"
          git push
